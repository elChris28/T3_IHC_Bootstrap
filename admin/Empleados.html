<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - Cine del Norte</title>
  <link rel="stylesheet" href="/admin/style/navegacionAdmin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="interfazAdmin">
        <aside class="barraLateral d-flex flex-column bg-dark text-white p-3">
        <h2 class="text-center mb-4">Cine del Norte</h2>
        <ul class="nav flex-column">
            <li class="nav-item mb-2"><a href="admin.html" class="nav-link text-white"><i class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
            <li class="nav-item mb-2"><a href="peliculas.html" class="nav-link text-white"><i class="fa-solid fa-video me-2"></i>Películas</a></li>
            <li class="nav-item mb-2"><a href="salas.html" class="nav-link text-white"><i class="fas fa-tv me-2"></i>Salas</a></li>
            <li class="nav-item mb-2"><a href="productos.html" class="nav-link text-white"><i class="fas fa-box-open me-2"></i>Productos</a></li>
            <li class="nav-item mb-2"><a href="Promociones.html" class="nav-link text-white"><i class="fa-solid fa-tag me-2"></i>Promociones</a></li>
            <li class="nav-item mb-2"><a href="empleados.html" class="nav-link text-white"><i class="fa-solid fa-users me-2"></i>Empleados</a></li>
            <li class="nav-item mb-2"><a href="reportes.html" class="nav-link text-white"><i class="fa-solid fa-folder-plus me-2"></i>Reportes</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Cerrar Sesión</a></li>
        </ul>
        </aside>
        <main class="contenido-principal">
            <header class="encabezado-principal">
                <h1>Empleados</h1>
                <div class="acciones-usuario">
                    <i class="fas fa-bell"></i>
                    <i class="fas fa-cog"></i>
                    <img src="/img/usuarioFondo.png" alt="avatar" class="avatar">
                </div>
            </header>
            <form class="d-flex flex-column gap-3">
                <div class="row">
                    <div class="col-md-6">
                    <input type="text" placeholder="Nombre" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                    <input type="text" placeholder="Apellido" class="form-control" required />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="DNI" required />
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Cargo" required />
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Turno" required />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <input type="email" class="form-control" placeholder="Correo electrónico" required />
                    </div>
                    <div class="col-md-6">
                        <input type="password" class="form-control" placeholder="Contraseña" required />
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3 my-3">
                    <img src="/img/usuarioFondo.png" alt="" class="rounded-circle object-fit-cover border" style="width: 80px; height: 80px;" />
                    <div>
                        <label class="btn btn-dark">
                        📁 Foto del personal
                        <input type="file" accept="image/*" class="d-none" />
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark">Agregar</button>
            </form>

            <h2 class="mt-4">Personal Asignado:</h2>
            <table class="table table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Correo</th>
                    <th>Cargo</th>
                    <th>Turno</th>
                    <th>Foto</th>
                    <th>Acciones</th>
                </tr>
                </thead>
            </table>
        </main>
    </div>
</body>
</html>
